<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Dark only. Light mode was pulled for a11y (yellow + light bg contrast). */
    :root {
      --bg: #0e0d0b;
      --surface: #161616;
      --surface-inner: #111111;
      --primary: #ffe800;
      --primary-foreground: #000000;
      --primary-hover: #fff04a;
      --text: #ffffff;
      --text-muted: #9e9e9e;
      --border-yellow: rgba(255, 232, 0, 0.10);
      --border-gray: rgba(145, 143, 140, 0.10);
      --border-white: rgba(255, 255, 255, 0.10);
      --success: oklch(0.65 0.15 155);
      --destructive: oklch(0.65 0.21 25);
      --radius: 16px;
      --radius-sm: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    [hidden] { display: none !important; }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-icon {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border-white);
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .title {
      flex: 1;
      min-width: 0;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      color: var(--text);
    }
    /* Form */
    .form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Controls list — single rounded container with dividers between items */
    .controls {
      border: 1px solid var(--border-yellow);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .controls.disabled .ctrl-item { opacity: 0.5; pointer-events: none; }

    .ctrl-item {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ctrl-item + .ctrl-item { border-top: 1px solid var(--border-yellow); }

    .row-master, .sub-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .row-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      color: var(--text);
      stroke-width: 1.75;
      transform-origin: center;
    }

    .row-label {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
    }

    .sub-toggle { padding-left: 32px; }
    .sub-label {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    /* Switches */
    .switch {
      position: relative;
      width: 32px;
      height: 18px;
      background: transparent;
      border: 1.5px solid var(--primary);
      border-radius: 999px;
      transition: background-color 0.18s ease;
      flex-shrink: 0;
      cursor: pointer;
    }
    .switch.on { background: var(--primary); }
    .switch.indeterminate { background: var(--primary); }

    .switch-thumb {
      position: absolute;
      top: 1.5px;
      left: 1.5px;
      width: 12px;
      height: 12px;
      border-radius: 999px;
      border: 1.5px solid var(--primary);
      background: transparent;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  background-color 0.18s, border-color 0.18s,
                  width 0.18s, height 0.18s, border-radius 0.18s, top 0.18s;
    }
    .switch.on .switch-thumb {
      transform: translateX(11px);
      background: var(--primary-foreground);
      border-color: var(--primary-foreground);
    }
    .switch.indeterminate .switch-thumb {
      transform: translateX(7px);
      background: var(--primary-foreground);
      border-color: var(--primary-foreground);
      width: 3px;
      height: 6px;
      border-radius: 2px;
      top: 4px;
    }

    /* Hover delight on row icons */
    @media (prefers-reduced-motion: no-preference) {
      .ctrl-item[data-row="styles"] .row-master:hover .row-icon {
        animation: drip 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .ctrl-item[data-row="variables"] .row-master:hover .row-icon {
        animation: open-braces 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
    }
    @keyframes drip {
      0%, 100% { transform: translateY(0); }
      55%      { transform: translateY(4px); }
    }
    @keyframes open-braces {
      0%, 100% { transform: scaleX(1); }
      55%      { transform: scaleX(1.18); }
    }

    /* Stats card */
    .stats {
      background: var(--surface);
      border: 1px solid var(--border-gray);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stats-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      padding: 16px 0;
    }

    .stats-filled {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sub-card {
      background: var(--surface-inner);
      border-radius: var(--radius-sm);
      padding: 16px;
    }

    .styles-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vars-card {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stat-row svg {
      flex-shrink: 0;
      stroke-width: 1.75;
    }
    .stat-row.primary {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .stat-row.primary svg { width: 24px; height: 24px; color: var(--text); }
    .stat-row:not(.primary) {
      font-size: 14px;
      color: var(--text);
      letter-spacing: -0.03em;
    }
    .stat-row:not(.primary) svg { width: 16px; height: 16px; color: var(--text); }
    .stat-row .num {
      color: var(--primary);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease;
    }
    .vars-card .stat-row { color: var(--text-muted); }

    /* 5-cell grid */
    .stat-grid {
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      width: 100%;
    }
    .stat-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
    }
    .stat-cell-num {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease;
    }
    .stat-cell.has .stat-cell-num { color: var(--primary); }
    .stat-cell-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Mode toggle */
    .mode-toggle {
      display: inline-flex;
      margin-left: auto;
      background: #161616;
      border: 1px solid rgba(255, 232, 0, 0.10);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .mode-btn {
      font: 600 12px/1 'Inter', sans-serif;
      color: #9e9e9e;
      background: transparent;
      border: 0;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #ffe800;
      color: #0e0d0b;
    }

    /* Progress — space is always reserved so the CTA position stays stable */
    .progress {
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }
    .progress.show {
      opacity: 1;
      pointer-events: auto;
    }
    .progress-label { font-size: 12px; color: var(--text-muted); font-weight: 700; }
    .progress-bar { width: 100%; height: 4px; background: var(--surface-inner); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 999px; transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

    /* CTA */
    .cta {
      width: 100%;
      padding: 14px 8px;
      background: var(--primary);
      color: #000;
      border: none;
      border-radius: 999px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.03em;
      cursor: pointer;
      transition: background-color 0.12s ease, opacity 0.12s ease;
    }
    .cta:hover:not(:disabled) { background: var(--primary-hover); }
    .cta:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .cta:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Confetti */
    .confetti-burst { position: fixed; bottom: 46px; left: 50%; width: 0; height: 0; pointer-events: none; z-index: 60; }
    .confetti-particle {
      position: absolute;
      top: 0; left: 0;
      width: 7px; height: 7px;
      background: var(--primary);
      border-radius: 2px;
      opacity: 0;
      animation: confetti-fly 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes confetti-fly {
      0%   { transform: translate(-50%, -50%) rotate(0); opacity: 0; }
      12%  { opacity: 1; }
      100% { transform: translate(calc(var(--tx) - 50%), calc(var(--ty) - 50%)) rotate(var(--r)); opacity: 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      background: var(--text);
      color: var(--bg);
      border: 1px solid var(--border-white);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
      max-width: calc(100% - 24px);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); color: oklch(0.15 0 0); border-color: transparent; }
    .toast.error { background: var(--destructive); color: oklch(0.99 0 0); border-color: transparent; }

    /* Lint mode */
    /* Lint mode — sections fill remaining space in the app flex column */
    #mode-strip,
    #mode-lint {
      flex: 1;
      min-height: 0;
    }

    /* Lint mode: flex column so results can scroll independently */
    #mode-lint {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }

    .card { background: var(--surface); border: 1px solid var(--border-gray); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .card-title { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .segmented { display: flex; width: 100%; gap: 2px; background: #111; border-radius: 999px; padding: 2px; }
    .seg-btn { flex: 1; font: 600 12px/1 'Inter'; color: #9e9e9e; background: transparent; border: 0; padding: 6px 0; border-radius: 999px; cursor: pointer; text-align: center; }
    .seg-btn.active { background: #ffe800; color: #0e0d0b; }

    /* Progress slot: no margin; gap on parent handles spacing */
    .progress-slot { opacity: 0; transition: opacity 120ms; }
    .progress-slot.visible { opacity: 1; }

    /* Results: scrollable, flex column, gaps between library sections */
    #lint-results {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.08) transparent;
    }

    .error { color: #ff6b6b; font: 400 12px/1.4 'Inter'; }
    .small { font-size: 12px; }
    .chip { background: rgba(255,232,0,0.12); color: #ffe800; font: 600 12px/1 'Inter'; padding: 6px 10px; border-radius: 999px; display: inline-block; cursor: pointer; }

    /* Library sections: no margin (parent gap handles spacing); more internal padding */
    .lib-section { background: #161616; border: 1px solid rgba(255,232,0,0.10); border-radius: 8px; padding: 14px; }
    .lib-header { font: 600 14px/1.2 'Inter'; color: #fff; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lib-badge { font: 600 10px/1 'Inter'; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; }
    .lib-badge.subscribed { background: rgba(255,232,0,0.12); color: #ffe800; }
    .lib-badge.external { background: rgba(255,180,0,0.12); color: #ffb400; }
    .lib-badge.unknown { background: rgba(255,100,100,0.12); color: #ff9999; }
    .lib-header::-webkit-details-marker { display: none; }

    /* Library body: tight gap between controls; separator + more air before item groups */
    .lib-body { margin-top: 12px; display: flex; flex-direction: column; gap: 0; }
    .lib-controls { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .lib-allow { color: #9e9e9e; font: 400 12px/1 'Inter'; display: inline-flex; gap: 6px; align-items: center; }

    /* Group headers: generous top margin to separate from controls / previous group */
    .group-title { color: #9e9e9e; font: 600 11px/1 'Inter'; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 12px; margin-bottom: 4px; }

    /* Item rows: slightly more vertical breathing */
    .item-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .item-row:last-child { border-bottom: none; padding-bottom: 0; }
    .item-name { color: #fff; font: 400 13px/1.2 'Inter'; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-meta { color: var(--text-muted); font: 400 12px/1 'Inter'; white-space: nowrap; }
    .item-actions { display: inline-flex; gap: 4px; }
    .ghost-btn { font: 600 11px/1 'Inter'; color: #ffe800; background: transparent; border: 1px solid rgba(255,232,0,0.30); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    .ghost-btn:hover { background: rgba(255,232,0,0.06); }
    .ghost { font: 600 16px/1 'Inter'; letter-spacing: -0.03em; color: #9e9e9e; background: transparent; border: 1px solid rgba(255,255,255,0.15); padding: 14px 8px; border-radius: 999px; cursor: pointer; display: block; width: 100%; }
    .card.empty { color: var(--text-muted); text-align: center; padding: 24px 16px; }
  </style>
</head>

              <div class="stat-row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                </svg>
                <span><span class="num" id="stat-styles-total">0</span> with styles</span>
              </div>
              <div class="stat-grid">
                <div class="stat-cell" data-cat="fill">
                  <div class="stat-cell-num" id="stat-fill">0</div>
                  <div class="stat-cell-label">FILL</div>
                </div>
                <div class="stat-cell" data-cat="stroke">
                  <div class="stat-cell-num" id="stat-stroke">0</div>
                  <div class="stat-cell-label">STROKE</div>
                </div>
                <div class="stat-cell" data-cat="effect">
                  <div class="stat-cell-num" id="stat-effect">0</div>
                  <div class="stat-cell-label">EFFECT</div>
                </div>
                <div class="stat-cell" data-cat="text">
                  <div class="stat-cell-num" id="stat-text">0</div>
                  <div class="stat-cell-label">TEXT</div>
                </div>
                <div class="stat-cell" data-cat="grid">
                  <div class="stat-cell-num" id="stat-grid-cell">0</div>
                  <div class="stat-cell-label">GRID</div>
                </div>
              </div>
            </div>

            <div class="sub-card vars-card">
              <div class="stat-row">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"></path>
                  <path d="M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path>
                </svg>
                <span><span class="num" id="stat-variables">0</span> with variables</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="progress" id="progress">
      <div class="progress-label" id="progress-label">Processing...</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <button class="cta" id="strip-btn" onclick="strip()" type="button">Strip 'em All!</button>
    </section>

    <section id="mode-lint" data-mode="lint" hidden>
      <div class="card">
        <div class="card-title">Scope</div>
        <div class="segmented" role="radiogroup" aria-label="Scope">
          <button class="seg-btn active" data-scope="selection" role="radio" aria-checked="true">Selection</button>
          <button class="seg-btn" data-scope="page" role="radio" aria-checked="false">Page</button>
          <button class="seg-btn" data-scope="file" role="radio" aria-checked="false">File</button>
        </div>
        <p class="muted small">Default: local file + subscribed libraries. Refine after scanning.</p>
      </div>

      <div class="progress-slot" id="lint-progress-slot">
        <div class="progress-bar"><div id="lint-progress-fill" class="progress-fill"></div></div>
        <div class="progress-label" id="lint-progress-label"></div>
      </div>

      <button id="lint-scan-btn" class="cta">Scan for intruders</button>

      <div id="lint-results" hidden></div>
      <div id="lint-error" class="error" hidden></div>
    </section>
  </div>

  <script>
    var STYLE_CATEGORIES = ['fill', 'stroke', 'effect', 'text', 'grid'];

    /* DOM ref cache — populated by cacheDom() at bootstrap. The hot paths
     * (drain, stats, CTA) used to hit document.getElementById on every
     * progress message and selection change; caching cuts the lookups.
     */
    var dom = {};

    function cacheDom() {
      dom.toast = document.getElementById('toast');
      dom.controls = document.getElementById('controls');
      dom.masterStyles = document.getElementById('master-styles');
      dom.masterVariables = document.getElementById('master-variables');
      dom.stats = document.getElementById('stats-card');
      dom.statsEmpty = document.getElementById('stats-empty');
      dom.statsFilled = document.getElementById('stats-filled');
      dom.statLayers = document.getElementById('stat-layers');
      dom.statStylesTotal = document.getElementById('stat-styles-total');
      dom.statVariables = document.getElementById('stat-variables');
      dom.progress = document.getElementById('progress');
      dom.progressLabel = document.getElementById('progress-label');
      dom.progressFill = document.getElementById('progress-fill');
      dom.stripBtn = document.getElementById('strip-btn');
      dom.modeBtnStrip = document.getElementById('mode-btn-strip');
      dom.modeBtnLint  = document.getElementById('mode-btn-lint');
      dom.screenStrip  = document.getElementById('mode-strip');
      dom.screenLint   = document.getElementById('mode-lint');
      dom.sub = {};
      dom.cells = {};
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        dom.sub[c] = document.getElementById('sub-' + c);
        dom.cells[c] = document.getElementById(c === 'grid' ? 'stat-grid-cell' : 'stat-' + c);
      }
      // Lint mode DOM refs
      dom.lintScope = 'selection';
      dom.lintScanBtn = document.getElementById('lint-scan-btn');
      dom.lintProgSlot = document.getElementById('lint-progress-slot');
      dom.lintProgFill = document.getElementById('lint-progress-fill');
      dom.lintProgLabel = document.getElementById('lint-progress-label');
      dom.lintResults = document.getElementById('lint-results');
      dom.lintError = document.getElementById('lint-error');
    }

    function setMode(mode) {
      var isStrip = mode === 'strip';
      dom.screenStrip.hidden = !isStrip;
      dom.screenLint.hidden  = isStrip;
      dom.modeBtnStrip.classList.toggle('active', isStrip);
      dom.modeBtnLint.classList.toggle('active', !isStrip);
      dom.modeBtnStrip.setAttribute('aria-selected', String(isStrip));
      dom.modeBtnLint.setAttribute('aria-selected', String(!isStrip));
    }

    /* Safe postMessage — guards against the parent iframe being torn down
     * during navigation or plugin shutdown. */
    function postToPlugin(msg) {
      try { parent.postMessage({ pluginMessage: msg }, '*'); } catch (e) {}
    }

    var pluginState = {
      styles: { fill: true, stroke: true, effect: true, text: true, grid: true },
      unlinkTokens: true,
      isProcessing: false,
      preferencesLoaded: false
    };

    var counterState = {
      baseLayers: 0,
      baseStyles: { fill: 0, stroke: 0, effect: 0, text: 0, grid: 0 },
      baseStylesTotal: 0,
      baseVariables: 0
    };

    var stripWatchdog = null;

    /* Watchdog timeout scales with selection size. Text-style detach loads
     * fonts which can be slow per layer, so a fixed 60s timeout falsely
     * trips on huge selections. Base 60s + 10ms per layer, capped at 5min. */
    function computeStripTimeout() {
      var n = counterState.baseLayers || 0;
      return Math.min(300000, 60000 + n * 10);
    }

    function armStripWatchdog() {
      clearStripWatchdog();
      stripWatchdog = setTimeout(function() {
        stripWatchdog = null;
        if (!pluginState.isProcessing) return;
        hideProgress();
        setProcessing(false);
        resetStripVisuals();
        showToast('Stripping took too long. Try a smaller selection.', 'error');
      }, computeStripTimeout());
    }

    function clearStripWatchdog() {
      if (stripWatchdog) { clearTimeout(stripWatchdog); stripWatchdog = null; }
    }

    function resetStripVisuals() {
      dom.statVariables.textContent = counterState.baseVariables || 0;
      dom.statStylesTotal.textContent = counterState.baseStylesTotal || 0;
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        setCellValue(c, counterState.baseStyles[c] || 0);
      }
    }

    /* ───── Preference migration ───── */
    function normalizePrefs(prefs) {
      if (!prefs) return null;
      var styles;
      if (prefs.styles && typeof prefs.styles === 'object') {
        styles = {
          fill:   prefs.styles.fill   !== false,
          stroke: prefs.styles.stroke !== false,
          effect: prefs.styles.effect !== false,
          text:   prefs.styles.text   !== false,
          grid:   prefs.styles.grid   !== false
        };
      } else {
        var on = prefs.unlinkStyles !== false;
        styles = { fill: on, stroke: on, effect: on, text: on, grid: on };
      }
      return {
        styles: styles,
        unlinkTokens: prefs.unlinkTokens !== false
      };
    }

    /* ───── Switch helpers ───── */
    function setSwitchState(el, state) {
      el.classList.remove('on', 'indeterminate');
      if (state === 'on') el.classList.add('on');
      else if (state === 'indeterminate') el.classList.add('indeterminate');
      el.setAttribute('aria-checked', state === 'on' ? 'true' : state === 'indeterminate' ? 'mixed' : 'false');
    }
    function setSubSwitch(el, on) {
      if (on) el.classList.add('on'); else el.classList.remove('on');
      el.setAttribute('aria-checked', on ? 'true' : 'false');
    }
    function stylesMasterState() {
      var s = pluginState.styles;
      var onCount = 0;
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) if (s[STYLE_CATEGORIES[i]]) onCount++;
      if (onCount === 0) return 'off';
      if (onCount === STYLE_CATEGORIES.length) return 'on';
      return 'indeterminate';
    }

    /* ───── Apply state to UI ───── */
    function applyPreferencesToUI() {
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        setSubSwitch(dom.sub[c], pluginState.styles[c]);
      }
      setSwitchState(dom.masterStyles, stylesMasterState());
      setSubSwitch(dom.masterVariables, pluginState.unlinkTokens);
      updateCtaState();
    }

    /* ───── Persistence ───── */
    function savePrefs() {
      postToPlugin({
        type: 'save-preferences',
        preferences: {
          styles: pluginState.styles,
          unlinkTokens: pluginState.unlinkTokens
        }
      });
    }

    /* ───── Toggle handlers ───── */
    function toggleStylesMaster(ev) {
      if (ev) ev.stopPropagation();
      if (pluginState.isProcessing) return;
      var state = stylesMasterState();
      var allOn = state !== 'on'; // off / indeterminate -> turn all on
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        pluginState.styles[STYLE_CATEGORIES[i]] = allOn;
      }
      applyPreferencesToUI();
      savePrefs();
    }

    function toggleStyleCategory(cat) {
      if (pluginState.isProcessing) return;
      pluginState.styles[cat] = !pluginState.styles[cat];
      setSubSwitch(dom.sub[cat], pluginState.styles[cat]);
      setSwitchState(dom.masterStyles, stylesMasterState());
      savePrefs();
      updateCtaState();
    }

    function toggleVariablesMaster(ev) {
      if (ev) ev.stopPropagation();
      if (pluginState.isProcessing) return;
      pluginState.unlinkTokens = !pluginState.unlinkTokens;
      setSubSwitch(dom.masterVariables, pluginState.unlinkTokens);
      savePrefs();
      updateCtaState();
    }

    /* ───── CTA state machine ───── */
    function anyStyleOn() {
      var s = pluginState.styles;
      return s.fill || s.stroke || s.effect || s.text || s.grid;
    }

    function updateCtaState() {
      var btn = dom.stripBtn;
      if (pluginState.isProcessing) {
        btn.disabled = true;
        btn.textContent = 'Stripping...';
        return;
      }
      var hasSelection = (counterState.baseLayers || 0) > 0;
      var anyOn = anyStyleOn() || pluginState.unlinkTokens;
      if (!hasSelection) {
        btn.disabled = true;
        btn.textContent = 'Select something';
      } else if (!anyOn) {
        btn.disabled = true;
        btn.textContent = 'Nothing to strip';
      } else {
        btn.disabled = false;
        btn.textContent = "Strip 'em All!";
      }
    }

    /* ───── Processing ───── */
    function setProcessing(isProcessing) {
      pluginState.isProcessing = isProcessing;
      if (isProcessing) dom.controls.classList.add('disabled');
      else dom.controls.classList.remove('disabled');
      updateCtaState();
    }

    function updateProgress(message, percent) {
      dom.progress.classList.add('show');
      dom.progressLabel.textContent = message;
      dom.progressFill.style.width = percent + '%';
      var p = Math.max(0, Math.min(1, percent / 100));
      setCounterDrain(p);
    }
    function hideProgress() { dom.progress.classList.remove('show'); }

    function setCounterDrain(progress) {
      var p = Math.max(0, Math.min(1, progress || 0));
      var inv = 1 - p;
      var anyStyleOnNow = anyStyleOn();
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        var only = pluginState.styles[c]
          ? Math.round((counterState.baseStyles[c] || 0) * inv)
          : (counterState.baseStyles[c] || 0);
        dom.cells[c].textContent = only;
      }
      var stylesTotal = anyStyleOnNow
        ? Math.round((counterState.baseStylesTotal || 0) * inv)
        : (counterState.baseStylesTotal || 0);
      dom.statStylesTotal.textContent = stylesTotal;
      var variables = pluginState.unlinkTokens
        ? Math.round((counterState.baseVariables || 0) * inv)
        : (counterState.baseVariables || 0);
      dom.statVariables.textContent = variables;
    }

    function strip() {
      if (pluginState.isProcessing) return;
      if (!anyStyleOn() && !pluginState.unlinkTokens) return;
      if ((counterState.baseLayers || 0) === 0) return;

      setProcessing(true);
      armStripWatchdog();
      updateProgress('Starting...', 0);

      postToPlugin({
        type: 'strip',
        styles: pluginState.styles,
        unlinkTokens: pluginState.unlinkTokens
      });
    }

    /* ───── Stats ───── */
    function setCellValue(category, n) {
      var num = dom.cells[category];
      var cell = num.parentElement;
      num.textContent = n;
      if (n > 0) cell.classList.add('has');
      else cell.classList.remove('has');
    }

    function updateStats(stats) {
      if (!stats || stats.layers === 0) {
        dom.statsEmpty.hidden = false;
        dom.statsFilled.hidden = true;
        counterState.baseLayers = 0;
        counterState.baseStyles = { fill: 0, stroke: 0, effect: 0, text: 0, grid: 0 };
        counterState.baseStylesTotal = 0;
        counterState.baseVariables = 0;
        updateCtaState();
        return;
      }

      dom.statLayers.textContent = stats.layers;
      dom.statStylesTotal.textContent = stats.stylesTotal || 0;
      dom.statVariables.textContent = stats.variables;

      var styleCounts = stats.styles || {};
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        setCellValue(c, styleCounts[c] || 0);
      }

      dom.statsEmpty.hidden = true;
      dom.statsFilled.hidden = false;

      counterState.baseLayers = stats.layers;
      counterState.baseStyles = {
        fill: styleCounts.fill || 0,
        stroke: styleCounts.stroke || 0,
        effect: styleCounts.effect || 0,
        text: styleCounts.text || 0,
        grid: styleCounts.grid || 0
      };
      counterState.baseStylesTotal = stats.stylesTotal || 0;
      counterState.baseVariables = stats.variables || 0;

      updateCtaState();
    }

    /* ───── Delight ───── */
    function celebrate() {
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      } catch (e) {}
      var count = 16;
      var burst = document.createElement('div');
      burst.className = 'confetti-burst';
      for (var i = 0; i < count; i++) {
        var p = document.createElement('span');
        p.className = 'confetti-particle';
        var angle = (180 + (i / count) * 180 + (Math.random() - 0.5) * 18) * Math.PI / 180;
        var dist = 70 + Math.random() * 60;
        p.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
        p.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
        p.style.setProperty('--r', Math.floor(Math.random() * 540 - 270) + 'deg');
        p.style.setProperty('--d', Math.floor(Math.random() * 80) + 'ms');
        burst.appendChild(p);
      }
      document.body.appendChild(burst);
      setTimeout(function() { burst.remove(); }, 1200);
    }

    function showToast(text, type) {
      dom.toast.textContent = text;
      dom.toast.className = 'toast ' + type + ' show';
      setTimeout(function() { dom.toast.classList.remove('show'); }, 3000);
    }

    /* ───── Message router ───── */
    window.onmessage = function(event) {
      if (!event.data.pluginMessage) return;
      var msg = event.data.pluginMessage;

      if (msg.type === 'preferences-loaded') {
        var n = normalizePrefs(msg.preferences);
        if (n) {
          pluginState.styles = n.styles;
          pluginState.unlinkTokens = n.unlinkTokens;
        }
        pluginState.preferencesLoaded = true;
        applyPreferencesToUI();
      } else if (msg.type === 'stats') {
        updateStats(msg.stats);
      } else if (msg.type === 'progress') {
        armStripWatchdog();
        updateProgress(msg.message, msg.percent);
      } else if (msg.type === 'success') {
        clearStripWatchdog();
        hideProgress();
        setProcessing(false);
        setCounterDrain(1);
        celebrate();
        showToast(msg.message, 'success');
      } else if (msg.type === 'error') {
        clearStripWatchdog();
        hideProgress();
        setProcessing(false);
        resetStripVisuals();
        showToast(msg.message, 'error');
      }
      if (msg.type === 'lint-progress') {
        dom.lintProgSlot.classList.add('visible');
        dom.lintProgFill.style.width = (msg.percent || 0) + '%';
        dom.lintProgLabel.textContent = msg.message || '';
        return;
      }
      if (msg.type === 'lint-error') {
        dom.lintProgSlot.classList.remove('visible');
        dom.lintError.textContent = msg.message || 'Unknown error.';
        dom.lintError.hidden = false;
        return;
      }
      if (msg.type === 'lint-result') {
        dom.lintProgSlot.classList.remove('visible');
        dom.lintResults.hidden = false;
        window.__lintLastIndex = msg.index;
        renderLintResults(msg.index);
        return;
      }
      if (msg.type === 'lint-detach-done') {
        if (msg.skipped && msg.skipped > 0) {
          var note = document.createElement('div');
          note.className = 'muted small';
          note.textContent = msg.skipped + ' items skipped: no longer present.';
          dom.lintResults.appendChild(note);
        }
        return;
      }
      if (msg.type === 'lint-selection-changed') {
        var chip = document.getElementById('lint-sel-changed-chip');
        if (!chip) {
          chip = document.createElement('div');
          chip.id = 'lint-sel-changed-chip';
          chip.className = 'chip';
          chip.textContent = 'Selection changed — re-scan?';
          dom.lintResults.insertBefore(chip, dom.lintResults.firstChild);
          chip.addEventListener('click', function () { dom.lintScanBtn.click(); });
        }
        return;
      }
    };

    // ── Lint results rendering (Task 6) ──────────────────────────────────────

    function renderLintResults(index) {
      var root = dom.lintResults;
      root.innerHTML = '';

      // Summary
      var summary = document.createElement('div');
      summary.className = 'card';
      summary.innerHTML =
        '<div class="card-title">Found ' + index.summary.intruderLibraries + ' intruder ' +
        (index.summary.intruderLibraries === 1 ? 'library' : 'libraries') + '</div>' +
        '<div class="muted small">' + index.summary.affectedLayers + ' layers affected · ' +
        index.summary.intruderStyles + ' styles, ' + index.summary.intruderVariables + ' variables</div>';
      root.appendChild(summary);

      if (!index.byLibrary.length || index.summary.intruderLibraries === 0) {
        var empty = document.createElement('div');
        empty.className = 'card empty';
        empty.textContent = 'No intruders found in this scope.';
        root.appendChild(empty);
        return;
      }

      // One section per non-allowed library
      for (var i = 0; i < index.byLibrary.length; i++) {
        var lib = index.byLibrary[i];
        if (lib.allowed) continue;
        root.appendChild(renderLibrarySection(lib));
      }

      if (index.summary.intruderLibraries > 0) {
        var bulk = document.createElement('button');
        bulk.id = 'lint-detach-all-btn';
        bulk.className = 'cta';
        bulk.textContent = 'Detach all intruders';
        root.appendChild(bulk);

        var rescan = document.createElement('button');
        rescan.className = 'ghost';
        rescan.textContent = 'Re-scan';
        rescan.addEventListener('click', function () { dom.lintScanBtn.click(); });
        root.appendChild(rescan);
      }
    }

    function renderLibrarySection(lib) {
      var section = document.createElement('details');
      section.className = 'lib-section';
      section.open = true;
      section.dataset.libKey = lib.libKey;

      var summary = document.createElement('summary');
      summary.className = 'lib-header';
      var badge = lib.isLocal ? '' :
        lib.isSubscribed ? '<span class="lib-badge subscribed">Subscribed library</span>' :
        lib.libKey.indexOf('unknown:') === 0 ? '<span class="lib-badge unknown">Unknown library</span>' :
        '<span class="lib-badge external">External library</span>';
      summary.innerHTML = escapeHtml(lib.name) + (badge ? ' ' + badge : '');
      section.appendChild(summary);

      var body = document.createElement('div');
      body.className = 'lib-body';

      // Allowed toggle (per-library detach wired in Task 9)
      var controls = document.createElement('div');
      controls.className = 'lib-controls';
      controls.innerHTML =
        '<label class="lib-allow"><input type="checkbox" data-action="allow"> Mark as allowed</label>' +
        '<button class="ghost-btn" data-action="detach-library">Detach all from this library</button>';
      body.appendChild(controls);

      if (lib.styles.length) {
        var sh = document.createElement('div');
        sh.className = 'group-title';
        sh.textContent = 'Styles (' + lib.styles.length + ')';
        body.appendChild(sh);
        for (var i = 0; i < lib.styles.length; i++) {
          body.appendChild(renderItemRow('style', lib.styles[i]));
        }
      }
      if (lib.variables.length) {
        var vh = document.createElement('div');
        vh.className = 'group-title';
        vh.textContent = 'Variables (' + lib.variables.length + ')';
        body.appendChild(vh);
        for (var j = 0; j < lib.variables.length; j++) {
          body.appendChild(renderItemRow('variable', lib.variables[j]));
        }
      }

      section.appendChild(body);
      return section;
    }

    function renderItemRow(kind, item) {
      var row = document.createElement('div');
      row.className = 'item-row';
      row.dataset.kind = kind;
      row.dataset.id = item.id;
      row.innerHTML =
        '<div class="item-name">' + escapeHtml(item.name || '(unnamed)') + '</div>' +
        '<div class="item-meta">' + item.layerIds.length + ' layers</div>' +
        '<div class="item-actions">' +
          '<button class="ghost-btn" data-action="select">select</button>' +
          '<button class="ghost-btn" data-action="detach">detach</button>' +
        '</div>';
      return row;
    }


    // findItemFromRow and escapeHtml are defined below (hoisted function declarations)

    function findItemFromRow(row) {
      var index = window.__lintLastIndex;
      if (!index) return null;
      var libKey = row.closest('.lib-section').dataset.libKey;
      var kind = row.dataset.kind;
      var id = row.dataset.id;
      var lib = index.byLibrary.find(function (l) { return l.libKey === libKey; });
      if (!lib) return null;
      var arr = kind === 'style' ? lib.styles : lib.variables;
      return arr.find(function (x) { return x.id === id; });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    document.addEventListener('click', function (e) {
      if (e.target && e.target.id === 'lint-detach-all-btn') {
        var idx = window.__lintLastIndex;
        if (!idx) return;
        var items = [];
        for (var i = 0; i < idx.byLibrary.length; i++) {
          var lib = idx.byLibrary[i];
          if (lib.allowed) continue;
          for (var s = 0; s < lib.styles.length; s++) {
            items.push({ kind: 'style', id: lib.styles[s].id, layerIds: lib.styles[s].layerIds });
          }
          for (var v = 0; v < lib.variables.length; v++) {
            items.push({ kind: 'variable', id: lib.variables[v].id, layerIds: lib.variables[v].layerIds });
          }
        }
        if (!items.length) return;
        parent.postMessage({ pluginMessage: { type: 'lint-detach', items: items } }, '*');
      }
    });

    function bootstrap() {
      cacheDom();
      dom.modeBtnStrip.addEventListener('click', function () { setMode('strip'); });
      dom.modeBtnLint.addEventListener('click',  function () { setMode('lint');  });

      // Lint scope toggle
      Array.prototype.forEach.call(document.querySelectorAll('#mode-lint .seg-btn'), function (btn) {
        btn.addEventListener('click', function () {
          Array.prototype.forEach.call(document.querySelectorAll('#mode-lint .seg-btn'), function (b) {
            b.classList.remove('active');
            b.setAttribute('aria-checked', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-checked', 'true');
          dom.lintScope = btn.getAttribute('data-scope');
        });
      });

      // Lint scan button
      dom.lintScanBtn.addEventListener('click', function () {
        dom.lintError.hidden = true;
        dom.lintResults.hidden = true;
        dom.lintProgSlot.classList.add('visible');
        dom.lintProgFill.style.width = '0%';
        dom.lintProgLabel.textContent = 'Scanning...';
        parent.postMessage({ pluginMessage: { type: 'lint-scan', scope: dom.lintScope } }, '*');
      });

      // Delegated click handler for lint results (must run after cacheDom sets dom.lintResults)
      dom.lintResults.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var row = btn.closest('.item-row');
        var section = btn.closest('.lib-section');
        var action = btn.getAttribute('data-action');

        if (action === 'select' && row) {
          var item = findItemFromRow(row);
          if (item) parent.postMessage({ pluginMessage: { type: 'lint-select-layers', layerIds: item.layerIds } }, '*');
          return;
        }
        if (action === 'detach' && row) {
          var item2 = findItemFromRow(row);
          if (!item2) return;
          parent.postMessage({ pluginMessage: { type: 'lint-detach', items: [{
            kind: row.dataset.kind, id: item2.id, layerIds: item2.layerIds,
          }] } }, '*');
          return;
        }
        if (action === 'detach-library' && section) {
          var libKey = section.dataset.libKey;
          var lib = (window.__lintLastIndex.byLibrary || []).find(function (l) { return l.libKey === libKey; });
          if (!lib) return;
          var items = lib.styles.map(function (s) { return { kind: 'style', id: s.id, layerIds: s.layerIds }; })
            .concat(lib.variables.map(function (v) { return { kind: 'variable', id: v.id, layerIds: v.layerIds }; }));
          parent.postMessage({ pluginMessage: { type: 'lint-detach', items: items } }, '*');
          return;
        }
        if (action === 'allow' && section) {
          var libKey2 = section.dataset.libKey;
          parent.postMessage({ pluginMessage: { type: 'lint-update-whitelist', libKey: libKey2, allowed: btn.checked } }, '*');
          return;
        }
      });

      applyPreferencesToUI();
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }

    try {
      console.log(
        '%c Strip \'em All! ',
        'background:#ffe800;color:#000;font-weight:700;padding:4px 10px;border-radius:6px;font-family:Inter,sans-serif'
      );
      console.log('%c Stripped clean by @neybarao', 'color:#888;font-style:italic');
    } catch (e) {}
  </script>
</body>
