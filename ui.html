<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --background: oklch(0.99 0.002 80);
      --foreground: oklch(0.18 0.005 80);
      --surface: oklch(0.97 0.003 80);
      --muted: oklch(0.96 0.003 80);
      --muted-foreground: oklch(0.52 0.005 80);
      --border: oklch(0.9 0.004 80);
      --card-border: oklch(0.85 0.05 100);
      --input: oklch(0.88 0.004 80);
      --ring: #ffe927;
      --primary: #ffe927;
      --primary-foreground: oklch(0.18 0.005 80);
      --primary-hover: #fff05a;
      --success: oklch(0.7 0.15 155);
      --destructive: oklch(0.62 0.21 25);
      --radius: 16px;
    }

    [data-theme="dark"] {
      --background: #0a0a0a;
      --foreground: oklch(0.98 0.002 80);
      --surface: oklch(0.18 0.005 80);
      --muted: oklch(0.22 0.005 80);
      --muted-foreground: oklch(0.65 0.005 80);
      --border: oklch(0.28 0.006 80);
      --card-border: oklch(0.45 0.08 100 / 0.35);
      --input: oklch(0.32 0.006 80);
      --ring: #ffe927;
      --primary: #ffe927;
      --primary-foreground: oklch(0.18 0.005 80);
      --primary-hover: #fff05a;
      --success: oklch(0.65 0.15 155);
      --destructive: oklch(0.65 0.21 25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: 'Lato', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 22px 20px 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }

    .title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--foreground);
      line-height: 1.1;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      flex-shrink: 0;
    }
    .theme-toggle:hover { background: var(--muted); color: var(--foreground); }
    .theme-toggle:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .theme-toggle svg { width: 16px; height: 16px; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    [data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    /* Detach list accordion */
    .detach-list {
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .detach-row + .detach-row { border-top: 1px solid var(--card-border); }

    .detach-row.disabled { opacity: 0.5; pointer-events: none; }

    .row-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease;
    }
    .row-header:hover { background: color-mix(in oklch, var(--primary) 6%, transparent); }

    .row-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

    .row-icon {
      width: 22px;
      height: 22px;
      color: var(--foreground);
      stroke-width: 1.75;
      flex-shrink: 0;
      transform-origin: center;
    }

    .row-label {
      font-size: 15px;
      font-weight: 400;
      color: var(--foreground);
    }

    .chevron {
      width: 16px;
      height: 16px;
      color: var(--muted-foreground);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .detach-row[data-expanded="true"] .chevron { transform: rotate(180deg); }

    /* Animated expand/collapse via grid-template-rows trick */
    .row-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .detach-row[data-expanded="true"] .row-body { grid-template-rows: 1fr; }
    .row-body-inner {
      overflow: hidden;
      min-height: 0;
    }

    .sub-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px 8px 50px;
      cursor: pointer;
      transition: background-color 0.12s ease;
    }
    .sub-toggle:hover { background: color-mix(in oklch, var(--primary) 5%, transparent); }
    .sub-toggle:last-child { padding-bottom: 14px; }

    .sub-label { font-size: 13px; color: var(--foreground); }

    /* Switch — base (master uses this size) */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      background: transparent;
      border: 1.5px solid var(--primary);
      border-radius: 999px;
      transition: background-color 0.18s ease;
      flex-shrink: 0;
      cursor: pointer;
    }
    .switch.on { background: var(--primary); }
    .switch.indeterminate { background: var(--primary); }

    .switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 15px;
      height: 15px;
      border-radius: 999px;
      border: 1.5px solid var(--primary);
      background: transparent;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.18s ease, border-color 0.18s ease, width 0.18s ease, height 0.18s ease, border-radius 0.18s ease;
    }
    .switch.on .switch-thumb {
      transform: translateX(18px);
      background: var(--primary-foreground);
      border-color: var(--primary-foreground);
    }
    .switch.indeterminate .switch-thumb {
      transform: translateX(11px);
      background: var(--primary-foreground);
      border-color: var(--primary-foreground);
      width: 4px;
      height: 8px;
      border-radius: 2px;
      top: 6px;
    }

    /* Smaller switch variant for sub-toggles */
    .switch.sm { width: 32px; height: 18px; border-width: 1.25px; }
    .switch.sm .switch-thumb { width: 12px; height: 12px; border-width: 1.25px; top: 1px; left: 1px; }
    .switch.sm.on .switch-thumb { transform: translateX(14px); }

    /* Hover delight on row icons */
    @media (prefers-reduced-motion: no-preference) {
      .detach-row[data-row="styles"] .row-header:hover .row-icon {
        animation: drip 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .detach-row[data-row="variables"] .row-header:hover .row-icon {
        animation: open-braces 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
    }
    @keyframes drip {
      0%   { transform: translateY(0); }
      55%  { transform: translateY(4px); }
      100% { transform: translateY(0); }
    }
    @keyframes open-braces {
      0%   { transform: scaleX(1); }
      55%  { transform: scaleX(1.18); }
      100% { transform: scaleX(1); }
    }

    /* Stats card */
    .stats {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px 22px;
      background: var(--surface);
      border-radius: var(--radius);
      height: 180px;
    }

    .stats-empty {
      text-align: center;
      color: var(--muted-foreground);
      font-size: 14px;
    }

    .stats-filled {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    [hidden] { display: none !important; }

    .stat {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: var(--muted-foreground);
    }
    .stat svg { width: 18px; height: 18px; flex-shrink: 0; stroke-width: 1.75; }
    .stat-primary { color: var(--foreground); font-weight: 700; font-size: 16px; }
    .stat-primary svg { width: 20px; height: 20px; }
    .stat strong {
      color: var(--foreground);
      font-weight: 700;
      transition: color 0.2s ease;
      font-variant-numeric: tabular-nums;
    }
    .stats.draining .stat strong,
    .stats.draining .stat-cell-num { color: var(--primary); }

    /* 5-cell style breakdown grid */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .stat-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 0;
    }
    .stat-cell-num {
      font-size: 17px;
      font-weight: 700;
      color: var(--foreground);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      transition: color 0.2s ease;
    }
    .stat-cell-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .stat-cell.empty .stat-cell-num {
      color: var(--muted-foreground);
      opacity: 0.45;
    }

    /* Progress */
    .progress { display: none; flex-direction: column; gap: 6px; }
    .progress.show { display: flex; }
    .progress-label { font-size: 12px; color: var(--muted-foreground); font-weight: 700; }
    .progress-bar { width: 100%; height: 4px; background: var(--muted); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--primary); border-radius: 999px; transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

    .spacer { flex: 1; min-height: 16px; }

    /* Button */
    .btn {
      width: 100%;
      height: 52px;
      background: var(--primary);
      color: var(--primary-foreground);
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-family: inherit;
      cursor: pointer;
      transition: background-color 0.12s ease, opacity 0.12s ease;
    }
    .btn:hover:not(:disabled) { background: var(--primary-hover); }
    .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Confetti */
    .confetti-burst { position: fixed; bottom: 46px; left: 50%; width: 0; height: 0; pointer-events: none; z-index: 60; }
    .confetti-particle {
      position: absolute;
      top: 0;
      left: 0;
      width: 7px;
      height: 7px;
      background: var(--primary);
      border-radius: 2px;
      opacity: 0;
      animation: confetti-fly 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: var(--d, 0ms);
    }
    @keyframes confetti-fly {
      0%   { transform: translate(-50%, -50%) rotate(0); opacity: 0; }
      12%  { opacity: 1; }
      100% { transform: translate(calc(var(--tx) - 50%), calc(var(--ty) - 50%)) rotate(var(--r)); opacity: 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      background: var(--foreground);
      color: var(--background);
      border: 1px solid var(--border);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 50;
      max-width: calc(100% - 24px);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { background: var(--success); color: oklch(0.15 0 0); border-color: transparent; }
    .toast.error { background: var(--destructive); color: oklch(0.99 0 0); border-color: transparent; }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="app">
    <div class="header">
      <div class="title">Strip 'em All!</div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" type="button">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path><path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path><path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="detach-list">
      <div class="detach-row" data-row="styles" data-expanded="false">
        <div class="row-header" onclick="toggleRowExpand('styles', event)">
          <div class="row-left">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
            <span class="row-label">Detach Styles</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
          <div class="row-right">
            <div class="switch on" id="master-styles" role="switch" aria-checked="true" onclick="toggleStylesMaster(event)">
              <div class="switch-thumb"></div>
            </div>
          </div>
        </div>
        <div class="row-body">
          <div class="row-body-inner">
            <div class="sub-toggle" onclick="toggleStyleCategory('fill')">
              <span class="sub-label">Fill</span>
              <div class="switch sm on" id="sub-fill" role="switch" aria-checked="true"><div class="switch-thumb"></div></div>
            </div>
            <div class="sub-toggle" onclick="toggleStyleCategory('stroke')">
              <span class="sub-label">Stroke</span>
              <div class="switch sm on" id="sub-stroke" role="switch" aria-checked="true"><div class="switch-thumb"></div></div>
            </div>
            <div class="sub-toggle" onclick="toggleStyleCategory('effect')">
              <span class="sub-label">Effect</span>
              <div class="switch sm on" id="sub-effect" role="switch" aria-checked="true"><div class="switch-thumb"></div></div>
            </div>
            <div class="sub-toggle" onclick="toggleStyleCategory('text')">
              <span class="sub-label">Text</span>
              <div class="switch sm on" id="sub-text" role="switch" aria-checked="true"><div class="switch-thumb"></div></div>
            </div>
            <div class="sub-toggle" onclick="toggleStyleCategory('grid')">
              <span class="sub-label">Grid</span>
              <div class="switch sm on" id="sub-grid" role="switch" aria-checked="true"><div class="switch-thumb"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="detach-row" data-row="variables">
        <div class="row-header" onclick="toggleVariablesMaster(event)">
          <div class="row-left">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"></path>
              <path d="M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path>
            </svg>
            <span class="row-label">Detach Variables</span>
          </div>
          <div class="row-right">
            <div class="switch on" id="master-variables" role="switch" aria-checked="true">
              <div class="switch-thumb"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="stats" id="stats-card">
      <div class="stats-empty" id="stats-empty">Select an object or frame to scan</div>
      <div class="stats-filled" id="stats-filled" hidden>
        <div class="stat stat-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path>
            <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path>
            <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path>
          </svg>
          <span><strong id="stat-layers">0</strong> layers</span>
        </div>

        <div class="stat-grid" id="stat-grid">
          <div class="stat-cell empty" data-cat="fill">
            <div class="stat-cell-num" id="stat-fill">0</div>
            <div class="stat-cell-label">Fill</div>
          </div>
          <div class="stat-cell empty" data-cat="stroke">
            <div class="stat-cell-num" id="stat-stroke">0</div>
            <div class="stat-cell-label">Stroke</div>
          </div>
          <div class="stat-cell empty" data-cat="effect">
            <div class="stat-cell-num" id="stat-effect">0</div>
            <div class="stat-cell-label">Effect</div>
          </div>
          <div class="stat-cell empty" data-cat="text">
            <div class="stat-cell-num" id="stat-text">0</div>
            <div class="stat-cell-label">Text</div>
          </div>
          <div class="stat-cell empty" data-cat="grid">
            <div class="stat-cell-num" id="stat-grid-cell">0</div>
            <div class="stat-cell-label">Grid</div>
          </div>
        </div>

        <div class="stat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"></path>
            <path d="M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"></path>
          </svg>
          <span><strong id="stat-variables">0</strong> with variables</span>
        </div>
      </div>
    </div>

    <div class="progress" id="progress">
      <div class="progress-label" id="progress-label">Processing...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="spacer"></div>

    <button class="btn" id="strip-btn" onclick="strip()" type="button">Strip 'em All!</button>
  </div>

  <script>
    var STYLE_CATEGORIES = ['fill', 'stroke', 'effect', 'text', 'grid'];

    var pluginState = {
      styles: { fill: true, stroke: true, effect: true, text: true, grid: true },
      unlinkTokens: true,
      theme: null,
      isProcessing: false,
      preferencesLoaded: false
    };

    var counterState = {
      baseLayers: 0,
      baseStyles: { fill: 0, stroke: 0, effect: 0, text: 0, grid: 0 },
      baseVariables: 0
    };

    var stripWatchdog = null;
    var STRIP_TIMEOUT_MS = 60000;

    // ──────────── Preference migration ────────────
    // Accepts old shape ({unlinkStyles, unlinkTokens, theme}) and new shape
    // ({styles, unlinkTokens, theme}). Returns the new shape.
    function normalizePrefs(prefs) {
      if (!prefs) return null;
      var styles;
      if (prefs.styles && typeof prefs.styles === 'object') {
        styles = {
          fill: prefs.styles.fill !== false,
          stroke: prefs.styles.stroke !== false,
          effect: prefs.styles.effect !== false,
          text: prefs.styles.text !== false,
          grid: prefs.styles.grid !== false
        };
      } else {
        var on = prefs.unlinkStyles !== false;
        styles = { fill: on, stroke: on, effect: on, text: on, grid: on };
      }
      return {
        styles: styles,
        unlinkTokens: prefs.unlinkTokens !== false,
        theme: prefs.theme || null
      };
    }

    // ──────────── Theme ────────────
    function resolveTheme(saved) {
      if (saved === 'light' || saved === 'dark') return saved;
      try {
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) { return 'light'; }
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      pluginState.theme = theme;
    }

    function toggleTheme() {
      applyTheme(pluginState.theme === 'dark' ? 'light' : 'dark');
      savePrefs();
    }

    // ──────────── Switch helpers ────────────
    function setSwitchState(el, state) {
      // state: 'on' | 'off' | 'indeterminate'
      el.classList.remove('on', 'indeterminate');
      if (state === 'on') el.classList.add('on');
      else if (state === 'indeterminate') el.classList.add('indeterminate');
      el.setAttribute('aria-checked', state === 'on' ? 'true' : state === 'indeterminate' ? 'mixed' : 'false');
    }

    function setSubSwitch(el, on) {
      if (on) el.classList.add('on'); else el.classList.remove('on');
      el.setAttribute('aria-checked', on ? 'true' : 'false');
    }

    function stylesMasterState() {
      var s = pluginState.styles;
      var onCount = 0;
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) if (s[STYLE_CATEGORIES[i]]) onCount++;
      if (onCount === 0) return 'off';
      if (onCount === STYLE_CATEGORIES.length) return 'on';
      return 'indeterminate';
    }

    // ──────────── Apply state to UI ────────────
    function applyPreferencesToUI() {
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        setSubSwitch(document.getElementById('sub-' + c), pluginState.styles[c]);
      }
      setSwitchState(document.getElementById('master-styles'), stylesMasterState());
      setSubSwitch(document.getElementById('master-variables'), pluginState.unlinkTokens);
      updateCtaState();
    }

    // ──────────── Persistence ────────────
    function savePrefs() {
      parent.postMessage({
        pluginMessage: {
          type: 'save-preferences',
          preferences: {
            styles: pluginState.styles,
            unlinkTokens: pluginState.unlinkTokens,
            theme: pluginState.theme
          }
        }
      }, '*');
    }

    // ──────────── Toggle handlers ────────────
    function toggleRowExpand(rowName, ev) {
      // Only expand if the click target wasn't the master switch.
      // Master switch already calls stopPropagation in its handler.
      var row = document.querySelector('.detach-row[data-row="' + rowName + '"]');
      if (!row) return;
      var expanded = row.getAttribute('data-expanded') === 'true';
      row.setAttribute('data-expanded', expanded ? 'false' : 'true');
    }

    function toggleStylesMaster(ev) {
      if (ev) ev.stopPropagation();
      if (pluginState.isProcessing) return;
      var state = stylesMasterState();
      // Indeterminate or off → turn all on. All on → turn all off.
      var allOn = state !== 'on';
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        pluginState.styles[STYLE_CATEGORIES[i]] = allOn;
      }
      applyPreferencesToUI();
      savePrefs();
    }

    function toggleStyleCategory(cat) {
      if (pluginState.isProcessing) return;
      pluginState.styles[cat] = !pluginState.styles[cat];
      setSubSwitch(document.getElementById('sub-' + cat), pluginState.styles[cat]);
      setSwitchState(document.getElementById('master-styles'), stylesMasterState());
      savePrefs();
      updateCtaState();
    }

    function toggleVariablesMaster(ev) {
      if (ev) ev.stopPropagation();
      if (pluginState.isProcessing) return;
      pluginState.unlinkTokens = !pluginState.unlinkTokens;
      setSubSwitch(document.getElementById('master-variables'), pluginState.unlinkTokens);
      savePrefs();
      updateCtaState();
    }

    // ──────────── CTA state machine ────────────
    function anyStyleOn() {
      var s = pluginState.styles;
      return s.fill || s.stroke || s.effect || s.text || s.grid;
    }

    function updateCtaState() {
      var btn = document.getElementById('strip-btn');
      if (pluginState.isProcessing) {
        btn.disabled = true;
        btn.textContent = 'Stripping...';
        return;
      }
      var hasSelection = (counterState.baseLayers || 0) > 0;
      var anyOn = anyStyleOn() || pluginState.unlinkTokens;
      if (!hasSelection) {
        btn.disabled = true;
        btn.textContent = 'Select something';
      } else if (!anyOn) {
        btn.disabled = true;
        btn.textContent = 'Nothing to strip';
      } else {
        btn.disabled = false;
        btn.textContent = "Strip 'em All!";
      }
    }

    // ──────────── Processing ────────────
    function setProcessing(isProcessing) {
      pluginState.isProcessing = isProcessing;
      var rows = document.querySelectorAll('.detach-row');
      for (var i = 0; i < rows.length; i++) {
        if (isProcessing) rows[i].classList.add('disabled');
        else rows[i].classList.remove('disabled');
      }
      updateCtaState();
    }

    function armStripWatchdog() {
      clearStripWatchdog();
      stripWatchdog = setTimeout(function() {
        stripWatchdog = null;
        if (!pluginState.isProcessing) return;
        hideProgress();
        setProcessing(false);
        resetStripVisuals();
        showToast('Stripping took too long. Try a smaller selection.', 'error');
      }, STRIP_TIMEOUT_MS);
    }

    function clearStripWatchdog() {
      if (stripWatchdog) { clearTimeout(stripWatchdog); stripWatchdog = null; }
    }

    function resetStripVisuals() {
      var card = document.getElementById('stats-card');
      if (card) card.classList.remove('draining');
      // restore counters to actual baseline values
      document.getElementById('stat-variables').textContent = counterState.baseVariables || 0;
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        var cellId = c === 'grid' ? 'stat-grid-cell' : 'stat-' + c;
        document.getElementById(cellId).textContent = counterState.baseStyles[c] || 0;
      }
    }

    function updateProgress(message, percent) {
      var container = document.getElementById('progress');
      container.classList.add('show');
      document.getElementById('progress-label').textContent = message;
      document.getElementById('progress-fill').style.width = percent + '%';

      var p = Math.max(0, Math.min(1, percent / 100));
      setCounterDrain(p);
    }

    function hideProgress() {
      document.getElementById('progress').classList.remove('show');
    }

    function setCounterDrain(progress) {
      var p = Math.max(0, Math.min(1, progress || 0));
      var inv = 1 - p;
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        var cellId = c === 'grid' ? 'stat-grid-cell' : 'stat-' + c;
        var only = pluginState.styles[c] ? Math.round((counterState.baseStyles[c] || 0) * inv) : (counterState.baseStyles[c] || 0);
        document.getElementById(cellId).textContent = only;
      }
      var variables = pluginState.unlinkTokens
        ? Math.round((counterState.baseVariables || 0) * inv)
        : (counterState.baseVariables || 0);
      document.getElementById('stat-variables').textContent = variables;
    }

    function strip() {
      if (pluginState.isProcessing) return;
      if (!anyStyleOn() && !pluginState.unlinkTokens) return;
      if ((counterState.baseLayers || 0) === 0) return;

      setProcessing(true);
      armStripWatchdog();

      document.getElementById('stats-card').classList.add('draining');

      updateProgress('Starting...', 0);

      parent.postMessage({
        pluginMessage: {
          type: 'strip',
          styles: pluginState.styles,
          unlinkTokens: pluginState.unlinkTokens
        }
      }, '*');
    }

    // ──────────── Stats ────────────
    function setCellValue(category, n) {
      var cellId = category === 'grid' ? 'stat-grid-cell' : 'stat-' + category;
      var num = document.getElementById(cellId);
      var cell = num.parentElement;
      num.textContent = n;
      if (n > 0) cell.classList.remove('empty');
      else cell.classList.add('empty');
    }

    function updateStats(stats) {
      var empty = document.getElementById('stats-empty');
      var filled = document.getElementById('stats-filled');
      var card = document.getElementById('stats-card');

      if (!stats || stats.layers === 0) {
        empty.hidden = false;
        filled.hidden = true;
        card.classList.remove('draining');
        counterState.baseLayers = 0;
        counterState.baseStyles = { fill: 0, stroke: 0, effect: 0, text: 0, grid: 0 };
        counterState.baseVariables = 0;
        updateCtaState();
        return;
      }

      document.getElementById('stat-layers').textContent = stats.layers;
      document.getElementById('stat-variables').textContent = stats.variables;

      var styleCounts = stats.styles || {};
      for (var i = 0; i < STYLE_CATEGORIES.length; i++) {
        var c = STYLE_CATEGORIES[i];
        setCellValue(c, styleCounts[c] || 0);
      }

      empty.hidden = true;
      filled.hidden = false;
      card.classList.remove('draining');

      counterState.baseLayers = stats.layers;
      counterState.baseStyles = {
        fill: styleCounts.fill || 0,
        stroke: styleCounts.stroke || 0,
        effect: styleCounts.effect || 0,
        text: styleCounts.text || 0,
        grid: styleCounts.grid || 0
      };
      counterState.baseVariables = stats.variables || 0;

      updateCtaState();
    }

    // ──────────── Delight ────────────
    function celebrate() {
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      } catch (e) {}
      var count = 16;
      var burst = document.createElement('div');
      burst.className = 'confetti-burst';
      for (var i = 0; i < count; i++) {
        var p = document.createElement('span');
        p.className = 'confetti-particle';
        var angle = (180 + (i / count) * 180 + (Math.random() - 0.5) * 18) * Math.PI / 180;
        var dist = 70 + Math.random() * 60;
        p.style.setProperty('--tx', (Math.cos(angle) * dist).toFixed(1) + 'px');
        p.style.setProperty('--ty', (Math.sin(angle) * dist).toFixed(1) + 'px');
        p.style.setProperty('--r', Math.floor(Math.random() * 540 - 270) + 'deg');
        p.style.setProperty('--d', Math.floor(Math.random() * 80) + 'ms');
        burst.appendChild(p);
      }
      document.body.appendChild(burst);
      setTimeout(function() { burst.remove(); }, 1200);
    }

    function showToast(text, type) {
      var el = document.getElementById('toast');
      el.textContent = text;
      el.className = 'toast ' + type + ' show';
      setTimeout(function() { el.classList.remove('show'); }, 3000);
    }

    // ──────────── Message router ────────────
    window.onmessage = function(event) {
      if (!event.data.pluginMessage) return;
      var msg = event.data.pluginMessage;

      if (msg.type === 'preferences-loaded') {
        var n = normalizePrefs(msg.preferences);
        if (n) {
          pluginState.styles = n.styles;
          pluginState.unlinkTokens = n.unlinkTokens;
          applyTheme(resolveTheme(n.theme));
        } else {
          applyTheme(resolveTheme(null));
        }
        pluginState.preferencesLoaded = true;
        applyPreferencesToUI();
      } else if (msg.type === 'stats') {
        updateStats(msg.stats);
      } else if (msg.type === 'progress') {
        armStripWatchdog();
        updateProgress(msg.message, msg.percent);
      } else if (msg.type === 'success') {
        clearStripWatchdog();
        hideProgress();
        setProcessing(false);
        setCounterDrain(1);
        celebrate();
        showToast(msg.message, 'success');
      } else if (msg.type === 'error') {
        clearStripWatchdog();
        hideProgress();
        setProcessing(false);
        resetStripVisuals();
        showToast(msg.message, 'error');
      }
    };

    applyTheme(resolveTheme(null));
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

    function bootstrap() { applyPreferencesToUI(); }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootstrap);
    } else {
      bootstrap();
    }

    try {
      console.log(
        '%c Strip \'em All! ',
        'background:#ffe927;color:#18181b;font-weight:700;padding:4px 10px;border-radius:6px;font-family:Lato,sans-serif'
      );
      console.log('%c Stripped clean by @neybarao', 'color:#888;font-style:italic');
    } catch (e) {}
  </script>
</body>
</html>
